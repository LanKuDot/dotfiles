# Dotfiles path configuration
# Format: source = destination
# Paths are relative to $HOME (~)
# Lines starting with # are comments, empty lines are ignored
# For directory symlinks, both source and destination must end with /

[git]
.gitconfig = .gitconfig

[mintty]
.minttyrc = .minttyrc

[rider]
.ideavimrc = .ideavimrc

[vim]
.vimrc = .vimrc
after/ = .vim/after/

[vscode]
vscode_setting.json = AppData/Roaming/Code/User/settings.json

[claude]
settings.json = .claude/settings.json
status-line-command.sh = .claude/status-line-command.sh
inform-popup/ = .claude/inform-popup/
