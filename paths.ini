# Dotfiles path configuration
# Format: source_file = destination_file
# Paths are relative to $HOME (~)
# Lines starting with # are comments, empty lines are ignored

[git]
.gitconfig = .gitconfig

[mintty]
.minttyrc = .minttyrc

[rider]
.ideavimrc = .ideavimrc

[vim]
.vimrc = .vimrc
after/syntax/after-syntax-python.vim = .vim/after/syntax/after-syntax-python.vim

[vscode]
vscode_setting.json = AppData/Roaming/Code/User/settings.json
